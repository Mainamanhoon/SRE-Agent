name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript and TypeScript
    runs-on: ubuntu-latest
    env:
      RIPGREP_EXECUTABLE: /usr/bin/rg
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.0.0
          cache: pnpm
      - name: Install read-only tool dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
          command -v "$RIPGREP_EXECUTABLE"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Run Temporal workflow integration test
        env:
          RUN_TEMPORAL_INTEGRATION: "true"
        run: pnpm --filter @sre-agent/repair-worker test:integration
      - run: pnpm build

  go:
    name: Go — ${{ matrix.module.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - name: github-app
            path: Backend/services/github-app
          - name: incident-detector
            path: Backend/services/incident-detector
          - name: incident-service
            path: Backend/services/incident-service
          - name: repair-run-service
            path: Backend/services/repair-run-service
          - name: sandbox-controller
            path: Backend/services/sandbox-controller
          - name: sandbox-executor
            path: Backend/services/sandbox-executor
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sre_agent_test
          POSTGRES_USER: sre_agent
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sre_agent -d sre_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: ${{ matrix.module.path }}/go.mod
      - name: Check formatting
        shell: bash
        run: |
          files=$(find "${{ matrix.module.path }}" -name '*.go' -print0 | xargs -0 gofmt -l)
          if [[ -n "$files" ]]; then
            printf 'Go files need gofmt:\n%s\n' "$files"
            exit 1
          fi
      - name: Run service database migrations twice
        if: matrix.module.name == 'incident-service' || matrix.module.name == 'repair-run-service' || matrix.module.name == 'github-app'
        env:
          PGPASSWORD: test-password
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          if [[ -d "${{ matrix.module.path }}/migrations" ]]; then
            for migration in ${{ matrix.module.path }}/migrations/*.sql; do
              psql "postgres://sre_agent:test-password@localhost:5432/sre_agent_test?sslmode=disable" -v ON_ERROR_STOP=1 -f "$migration"
            done
            for migration in ${{ matrix.module.path }}/migrations/*.sql; do
              psql "postgres://sre_agent:test-password@localhost:5432/sre_agent_test?sslmode=disable" -v ON_ERROR_STOP=1 -f "$migration"
            done
          fi
      - name: Vet and test
        working-directory: ${{ matrix.module.path }}
        env:
          TEST_DATABASE_URL: postgres://sre_agent:test-password@localhost:5432/sre_agent_test?sslmode=disable
        run: |
          go vet ./...
          go test -count=1 ./...

  manifests:
    name: Compose, Kubernetes, and collector configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Validate Kubernetes resources
        run: >-
          docker run --rm
          -v "$PWD/Backend/deploy:/manifests:ro"
          ghcr.io/yannh/kubeconform:v0.6.7
          -strict -summary -kubernetes-version 1.32.0
          /manifests/core-services.yaml /manifests/remaining-services.yaml
      - name: Validate OpenTelemetry Collector configuration
        run: >-
          docker run --rm
          -v "$PWD/Backend/services/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro"
          otel/opentelemetry-collector-contrib:0.160.0
          validate --config=/etc/otelcol-contrib/config.yaml

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    name: Build and scan ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    needs: [javascript, go, manifests, secrets]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: control-api
            context: .
            dockerfile: Backend/services/control-api/Dockerfile
          - name: frontend
            context: .
            dockerfile: Frontend/Dockerfile
          - name: incident-detector
            context: Backend/services/incident-detector
            dockerfile: Dockerfile
          - name: incident-service
            context: Backend/services/incident-service
            dockerfile: Dockerfile
          - name: incident-service-migrate
            context: Backend/services/incident-service
            dockerfile: Dockerfile.migrate
          - name: repair-run-service
            context: Backend/services/repair-run-service
            dockerfile: Dockerfile
          - name: repair-run-service-migrate
            context: Backend/services/repair-run-service
            dockerfile: Dockerfile.migrate
          - name: repair-worker
            context: .
            dockerfile: Backend/services/repair-worker/Dockerfile
          - name: agent-runner
            context: .
            dockerfile: Backend/services/agent-runner/Dockerfile
          - name: sandbox-controller
            context: Backend/services/sandbox-controller
            dockerfile: Dockerfile
          - name: sandbox-executor-node
            context: Backend/services/sandbox-executor
            dockerfile: Dockerfile.node
          - name: sandbox-executor-go
            context: Backend/services/sandbox-executor
            dockerfile: Dockerfile.go-toolchain
          - name: github-app
            context: Backend/services/github-app
            dockerfile: Dockerfile
          - name: github-app-migrate
            context: Backend/services/github-app
            dockerfile: Dockerfile.migrate
          - name: otel-collector
            context: Backend/services/otel-collector
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Set image prefix
        id: image
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build container
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          load: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.image.outputs.prefix }}/${{ matrix.image.name }}:${{ github.sha }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan built image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.prefix }}/${{ matrix.image.name }}:${{ github.sha }}
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Write immutable image evidence
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p release-evidence
          cat > "release-evidence/${{ matrix.image.name }}.json" <<EOF
          {
            "image": "${{ steps.image.outputs.prefix }}/${{ matrix.image.name }}",
            "sourceCommit": "${GITHUB_SHA}",
            "releaseTag": "${GITHUB_REF_NAME}",
            "digest": "${{ steps.build.outputs.digest }}",
            "sbom": "BuildKit SBOM attestation generated",
            "vulnerabilityScan": "passed"
          }
          EOF
      - name: Upload release evidence
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: image-evidence-${{ matrix.image.name }}
          path: release-evidence/
          if-no-files-found: error

  release-summary:
    name: Release evidence summary
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [images, go, javascript, manifests, secrets]
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-evidence-*
          path: release-evidence
          merge-multiple: true
      - name: Create release summary
        shell: bash
        run: |
          {
            echo "## Release evidence for ${GITHUB_REF_NAME}"
            echo
            echo "All JavaScript, Go, manifest, secret-scan, container-build, and vulnerability-scan jobs passed."
            echo
            echo "The incident migration image was built and scanned. Database migrations are exercised twice against a clean PostgreSQL service in the Go CI job. Production migration execution remains a deployment gate and must complete before application rollout."
            echo
            echo "### Immutable image digests"
            echo
            for file in release-evidence/*.json; do
              image=$(basename "$file" .json)
              digest=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["digest"])' "$file")
              echo "- $image: $digest"
            done
          } >> "$GITHUB_STEP_SUMMARY"
