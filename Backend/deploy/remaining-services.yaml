apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-controller
  namespace: sre-agent-sandboxes
spec:
  replicas: 2
  selector: { matchLabels: { app: sandbox-controller } }
  template:
    metadata:
      labels: { app: sandbox-controller }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "4030", prometheus.io/path: /metrics }
    spec:
      serviceAccountName: sandbox-controller
      securityContext: { runAsNonRoot: true }
      containers:
        - name: sandbox-controller
          image: registry.example/sre-agent/sandbox-controller:REPLACE_ME
          ports: [{ name: http, containerPort: 4030 }]
          env:
            - { name: APP_ENV, value: production }
            - { name: API_AUTH_ENABLED, value: "true" }
            - { name: SANDBOX_NAMESPACE, value: sre-agent-sandboxes }
            - { name: SANDBOX_RUNTIME_CLASS, value: gvisor }
            - { name: SANDBOX_NODE_IMAGE, value: registry.example/sre-agent/sandbox-node:REPLACE_ME }
            - { name: SANDBOX_GO_IMAGE, value: registry.example/sre-agent/sandbox-go:REPLACE_ME }
            - name: API_AUTH_TOKEN
              valueFrom: { secretKeyRef: { name: sre-agent-service-auth, key: internal-service-token } }
            - name: SOURCE_AUTH_TOKEN
              valueFrom: { secretKeyRef: { name: sre-agent-service-auth, key: internal-service-token } }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
          readinessProbe: { httpGet: { path: /ready, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: sandbox-controller, namespace: sre-agent-sandboxes }
spec: { selector: { app: sandbox-controller }, ports: [{ name: http, port: 4030, targetPort: http }] }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: sandbox-controller, namespace: sre-agent-sandboxes }
spec: { minAvailable: 1, selector: { matchLabels: { app: sandbox-controller } } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: otel-collector }
spec:
  serviceName: otel-collector-headless
  replicas: 2
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata: { labels: { app: otel-collector } }
    spec:
      securityContext: { runAsNonRoot: true, fsGroup: 10001 }
      containers:
        - name: otel-collector
          image: registry.example/sre-agent/otel-collector:REPLACE_ME
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: health, containerPort: 13133 }
          env:
            - { name: DEPLOYMENT_ENVIRONMENT, value: production }
            - { name: OTEL_EXPORTER_INSECURE, value: "true" }
          volumeMounts: [{ name: queue, mountPath: /var/lib/otelcol }]
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "2", memory: 1Gi } }
          readinessProbe: { httpGet: { path: /, port: health }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /, port: health }, periodSeconds: 10 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
  volumeClaimTemplates:
    - metadata: { name: queue }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 10Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: otel-collector }
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
---
apiVersion: v1
kind: Service
metadata: { name: otel-collector-headless }
spec: { clusterIP: None, selector: { app: otel-collector }, ports: [{ name: otlp-grpc, port: 4317, targetPort: otlp-grpc }] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: otel-collector-ingress }
spec:
  podSelector: { matchLabels: { app: otel-collector } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sre-agent
      ports:
        - { protocol: TCP, port: 4317 }
        - { protocol: TCP, port: 4318 }
