apiVersion: v1
kind: Namespace
metadata:
  name: sre-agent-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-runner
  namespace: sre-agent-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-runner-deployment-reader
  namespace: default
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-runner-deployment-reader
  namespace: default
subjects:
  - kind: ServiceAccount
    name: agent-runner
    namespace: sre-agent-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-runner-deployment-reader
