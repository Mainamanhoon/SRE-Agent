global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]

  - job_name: incident-detector
    metrics_path: /metrics
    static_configs:
      - targets: [incident-detector:4010]

  - job_name: incident-service
    metrics_path: /metrics
    static_configs:
      - targets: [incident-service:4020]

  - job_name: sandbox-controller
    metrics_path: /metrics
    static_configs:
      - targets: [sandbox-controller:4030]

  - job_name: github-app
    metrics_path: /metrics
    static_configs:
      - targets: [github-app:4050]
