services:
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    ports:
      - "16686:16686"

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./Backend/services/otel-collector/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - sre_agent_loki:/loki

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"
    volumes:
      - ./Backend/services/otel-collector/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - sre_agent_prometheus:/prometheus

  otel-collector:
    build:
      context: ./Backend/services/otel-collector
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    depends_on:
      - jaeger
      - loki
      - prometheus
    environment:
      DEPLOYMENT_ENVIRONMENT: development
      OTEL_EXPORTER_INSECURE: "true"
    volumes:
      - sre_agent_otel_queue:/var/lib/otelcol

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sre_agent
      POSTGRES_USER: sre_agent
      POSTGRES_PASSWORD: sre_agent_local
    ports:
      - "5432:5432"
    volumes:
      - sre_agent_postgres:/var/lib/postgresql/data
      - ./Backend/services/incident-service/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sre_agent -d sre_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.28.1
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: sre_agent
      POSTGRES_PWD: sre_agent_local
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  control-api:
    build:
      context: .
      dockerfile: Backend/services/control-api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      SERVICE_NAME: control-api
      SERVICE_VERSION: local
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      INCIDENT_DETECTOR_URL: http://incident-detector:4010
      INCIDENT_SERVICE_URL: http://incident-service:4020
      AGENT_RUNNER_URL: http://agent-runner:4040
      AGENT_RUNNER_REQUIRED: "false"
      TEMPORAL_ADDRESS: temporal:7233
      API_AUTH_ENABLED: "false"
      API_AUTH_TOKEN: ${CONTROL_API_TOKEN:-}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token-change-me-0001}
      REQUESTS_PER_SECOND: ${CONTROL_API_RPS:-2000}
      REQUEST_BURST: ${CONTROL_API_BURST:-4000}
    ports:
      - "4000:4000"
    depends_on:
      - incident-detector
      - incident-service
      - otel-collector

  incident-detector:
    build:
      context: ./Backend/services/incident-detector
    environment:
      HTTP_ADDRESS: :4010
      SERVICE_VERSION: local
      APP_ENV: development
      INCIDENT_SERVICE_URL: http://incident-service:4020
      API_AUTH_ENABLED: "true"
      API_AUTH_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token-change-me-0001}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token-change-me-0001}
      REQUESTS_PER_SECOND: ${INCIDENT_DETECTOR_RPS:-2000}
      REQUEST_BURST: ${INCIDENT_DETECTOR_BURST:-4000}
    ports:
      - "4010:4010"
    depends_on:
      - incident-service

  incident-service:
    build:
      context: ./Backend/services/incident-service
    environment:
      HTTP_ADDRESS: :4020
      SERVICE_VERSION: local
      APP_ENV: development
      DATABASE_URL: postgres://sre_agent:sre_agent_local@postgres:5432/sre_agent?sslmode=disable
      API_AUTH_ENABLED: "true"
      API_AUTH_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token-change-me-0001}
      REQUESTS_PER_SECOND: ${INCIDENT_SERVICE_RPS:-2000}
      REQUEST_BURST: ${INCIDENT_SERVICE_BURST:-4000}
    ports:
      - "4020:4020"
    depends_on:
      postgres:
        condition: service_healthy

  repair-worker:
    build:
      context: .
      dockerfile: Backend/services/repair-worker/Dockerfile
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: repair-workflows
      TEMPORAL_CONNECT_MAX_ATTEMPTS: 30
      SERVICE_VERSION: local
      INCIDENT_SERVICE_URL: http://incident-service:4020
      AGENT_RUNNER_URL: http://agent-runner:4040
      SANDBOX_CONTROLLER_URL: http://sandbox-controller:4030
      GITHUB_APP_URL: http://github-app:4050
      SANDBOX_SOURCE_BASE_URL: http://github-app:4050
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token-change-me-0001}
      DOWNSTREAM_TIMEOUT_MS: 900000
    depends_on:
      temporal:
        condition: service_healthy

  agent-runner:
    profiles: ["agent"]
    build:
      context: .
      dockerfile: Backend/services/agent-runner/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4040
      SERVICE_NAME: agent-runner
      SERVICE_VERSION: local
      CONTROL_API_URL: http://control-api:4000
      INCIDENT_SERVICE_URL: http://incident-service:4020
      TRACE_QUERY_URL: http://jaeger:16686
      LOKI_QUERY_URL: ${LOKI_QUERY_URL:-http://loki:3100}
      PROMETHEUS_QUERY_URL: ${PROMETHEUS_QUERY_URL:-http://prometheus:9090}
      KUBERNETES_DEFAULT_NAMESPACE: ${KUBERNETES_DEFAULT_NAMESPACE:-default}
      KUBERNETES_ALLOWED_NAMESPACES: ${KUBERNETES_ALLOWED_NAMESPACES:-default}
      KUBERNETES_SERVICE_LABEL: ${KUBERNETES_SERVICE_LABEL:-app.kubernetes.io/name}
      AGENT_HARNESS: ${AGENT_HARNESS:-deepseek}
      AGENT_MCP_SERVER_ENTRYPOINT: /app/dist/mcp-server.js
      AGENT_WORKSPACE_PATH: /workspace
      DEEPSEEK_HOME: /var/lib/agent-runner/dsh
      DEEPSEEK_PROFILE: sdk
      DEEPSEEK_PATCH_PATHS: ${DEEPSEEK_PATCH_PATHS:-/app/config/gemini.cordis.patch.yml,/app/config/project-tools.cordis.patch.yml}
      DEEPSEEK_PROVIDER: ${DEEPSEEK_PROVIDER:-google}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-gemini-3.8-flash}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      API_AUTH_ENABLED: "true"
      API_AUTH_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token-change-me-0001}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token-change-me-0001}
      MAX_CONCURRENT_DIAGNOSES: ${MAX_CONCURRENT_DIAGNOSES:-20}
      MAX_QUEUED_DIAGNOSES: ${MAX_QUEUED_DIAGNOSES:-1000}
      DIAGNOSIS_TIMEOUT_MS: ${DIAGNOSIS_TIMEOUT_MS:-900000}
      MAX_TOOL_CALLS_PER_RUN: ${MAX_TOOL_CALLS_PER_RUN:-30}
      MCP_TOOL_MAX_RESULT_BYTES: ${MCP_TOOL_MAX_RESULT_BYTES:-2000000}
      GIT_EXECUTABLE: git
    ports:
      - "4040:4040"
    volumes:
      - ${AGENT_WORKSPACE_HOST_PATH:-./tmp/agent-workspace}:/workspace:ro
      - agent_runner_data:/var/lib/agent-runner
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - control-api
      - incident-service
      - jaeger
      - loki
      - prometheus

  sandbox-controller:
    profiles: ["kubernetes"]
    build:
      context: ./Backend/services/sandbox-controller
    environment:
      HTTP_ADDRESS: :4030
      SERVICE_VERSION: local
      APP_ENV: development
      SANDBOX_NAMESPACE: sre-agent-sandboxes
      SANDBOX_RUNTIME_CLASS: gvisor
      SANDBOX_NODE_IMAGE: ${SANDBOX_NODE_IMAGE:-sre-agent/sandbox-node:local}
      SANDBOX_GO_IMAGE: ${SANDBOX_GO_IMAGE:-sre-agent/sandbox-go:local}
      API_AUTH_ENABLED: "true"
      API_AUTH_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token-change-me-0001}
      SOURCE_AUTH_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token-change-me-0001}
    ports:
      - "4030:4030"
    volumes:
      - ${KUBECONFIG:-~/.kube/config}:/home/nonroot/.kube/config:ro

  github-app:
    profiles: ["github"]
    build:
      context: ./Backend/services/github-app
    environment:
      HTTP_ADDRESS: :4050
      APP_ENV: development
      SERVICE_VERSION: local
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_BASE64: ${GITHUB_APP_PRIVATE_KEY_BASE64:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      API_AUTH_ENABLED: "true"
      API_AUTH_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token-change-me-0001}
    ports:
      - "4050:4050"

volumes:
  sre_agent_postgres:
  agent_runner_data:
  sre_agent_loki:
  sre_agent_prometheus:
  sre_agent_otel_queue:
